---
linux64-mold:
    description: "mold toolchain build"
    treeherder:
        symbol: TL(mold)
    worker-type: b-linux-docker-amd
    worker:
        max-run-time: 3600
    run:
        script: build-mold.sh
        resources:
            - taskcluster/scripts/misc/mold-icf-symtab.patch
        toolchain-artifact: public/build/mold.tar.zst
    fetches:
        fetch:
            - mold
        toolchain:
            - linux64-clang-toolchain
            - linux64-rust-toolchain
            - linux64-toolchain-sysroot
